# The Elgato Cam Link 4K's loopback device, made when the module loads: upstream
# adds it at runtime (`v4l2loopback-ctl add` in camlink-4k-loopback.service),
# which noble's v4l2loopback 0.12.7 cannot do. The unit only adds a device when
# none is labelled "Cam Link 4K", so with this one in place it never asks.
# The first device keeps the label v4l2-relayd.conf gives it, as Arch keeps the
# module's own; both hide until something writes to them. This file sorts after
# v4l2-relayd.conf and upstream's v4l2loopback-exclusive-caps.conf, and of a
# parameter given twice the module keeps the last value.
options v4l2loopback devices=2 exclusive_caps=1,1 card_label="Virtual Camera,Cam Link 4K"
