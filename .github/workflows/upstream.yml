name: upstream

# Watches upstream Omarchy for the port, one channel per job, and keeps an
# issue open for a channel only while the port has something to do there: a
# newer ref the channel's pin has not reached, a pin behind what upstream
# ships with it, a patch that no longer applies, a package name without an
# Ubuntu source. The issue says what and how to settle it, and closes on the
# first run that finds nothing left: daily, on demand, and on every push to
# main that touches what settles it. Edge follows upstream's default branch,
# which moves every day, so only what breaks it (a patch, a missing source)
# opens its issue. Every report lands in the run's summary, actionable or not;
# a ref asked for by hand gets a report there and no issue.

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - versions.env
      - versions.rc.env
      - patches/**
      - packages/**
      - lib/channel.sh
      - lib/catalog.py
      - bin/omarchy-upstream-check
      - .github/workflows/upstream.yml
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to check (a ref needs one channel)"
        type: choice
        options: [all, stable, rc, edge]
        default: all
      target:
        description: "Upstream ref to compare with, reported in the run's summary only (empty: the newest the channel admits)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, rc, edge]
    # One run per channel at a time: two racing would post the same issue twice.
    concurrency:
      group: upstream-${{ matrix.channel }}
      cancel-in-progress: false
    env:
      CHANNEL: ${{ matrix.channel }}
      WANTED: ${{ github.event.inputs.channel || 'all' }}
      TARGET: ${{ github.event.inputs.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the channel
        id: resolve
        run: |
          if [[ $WANTED != all && $WANTED != "$CHANNEL" ]]; then
            echo "skip=1" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n $TARGET && $WANTED == all ]]; then
            echo "::error::a target ref needs one channel, not all"
            exit 1
          fi
          export PORT_DIR=$PWD OMARCHY_CHANNEL=$CHANNEL
          source lib/channel.sh
          git clone --quiet --filter=blob:none "$OMARCHY_REPO" "$RUNNER_TEMP/omarchy"
          git -C "$RUNNER_TEMP/omarchy" fetch --quiet --tags origin
          git -C "$RUNNER_TEMP/omarchy" remote set-head origin --auto
          pin=$(channel_tag)
          newest=${TARGET:-$(channel_newest "$CHANNEL" "$RUNNER_TEMP/omarchy")}
          if ! git -C "$RUNNER_TEMP/omarchy" rev-parse --verify --quiet "$newest^{commit}" >/dev/null; then
            echo "::error::unknown upstream ref $newest"
            exit 1
          fi
          {
            echo "pin=$pin"
            echo "newest=$newest"
            echo "branch=$(upstream_default_branch "$RUNNER_TEMP/omarchy")"
            [[ -z $TARGET ]] || echo "oneoff=1"
          } >>"$GITHUB_OUTPUT"

      - name: Report
        id: report
        if: steps.resolve.outputs.skip != '1'
        env:
          NEWEST: ${{ steps.resolve.outputs.newest }}
        run: |
          set +e
          bin/omarchy-upstream-check --repo "$RUNNER_TEMP/omarchy" --channel "$CHANNEL" --target "$NEWEST" --problems problems.tsv >report.md
          status=$?
          cat report.md >>"$GITHUB_STEP_SUMMARY"
          cat report.md
          # 0 and 1 are reports; anything else is the check failing to run.
          (( status <= 1 )) || { echo "::error::omarchy-upstream-check exited $status"; exit 1; }
          if grep -q '^unread' problems.tsv; then
            echo "::warning::the $CHANNEL check could not read a package database; versions were not compared"
          fi

      - name: Settle the channel's issue
        if: steps.resolve.outputs.skip != '1' && steps.resolve.outputs.oneoff != '1'
        env:
          PIN: ${{ steps.resolve.outputs.pin }}
          NEWEST: ${{ steps.resolve.outputs.newest }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
        run: |
          # What there is to do. Edge's pins are rc's, measured against a
          # branch that moves daily: only a patch or a missing source counts.
          if [[ $CHANNEL == edge ]]; then
            blocking='^(patches|packages|names|migrations)\b'
          else
            blocking='^(patches|packages|names|migrations|versions)\b'
          fi
          kinds=$(grep -oE "$blocking" problems.tsv | sort -u | paste -sd' ')
          release=""
          [[ $CHANNEL == edge || $NEWEST == "$PIN" ]] || release=1

          marker="<!-- omarchy-upstream:$CHANNEL -->"
          # The channel's open issue: the marker, or a title from before it.
          number=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=upstream&state=open&per_page=100" \
            --jq ".[] | select(.pull_request == null) | select((.body // \"\" | contains(\"$marker\")) or (.title | test(\"(for|of|breaks) the $CHANNEL channel\"))) | .number" | head -n1)

          if [[ -z $release && -z $kinds ]]; then
            if [[ -n $number ]]; then
              if [[ $CHANNEL == edge ]]; then
                gh issue close "$number" --comment "Nothing left for the edge channel: the rc series applies on upstream's $BRANCH and every package name it asks for has a source."
              else
                gh issue close "$number" --comment "Nothing left for the $CHANNEL channel: its pin is $PIN, the newest ref it admits, and the port matches upstream there."
              fi
            fi
            echo "Nothing to do for the $CHANNEL channel."
            exit 0
          fi

          if [[ -n $release ]]; then
            title="Upstream $NEWEST for the $CHANNEL channel: the port is on $PIN"
          elif [[ $CHANNEL == edge ]]; then
            title="Upstream $BRANCH breaks the edge channel: $kinds"
          else
            title="The $CHANNEL channel on $PIN lags upstream: $kinds"
          fi
          {
            echo "$marker"
            echo "## To settle"
            echo
            if [[ -n $release ]]; then
              echo "- Move \`OMARCHY_TAG_$(tr '[:lower:]' '[:upper:]' <<<"$CHANNEL")\` in \`versions.env\` to \`$NEWEST\`, bring the pins under Versions to what the ring and the mirror carry there, and run the harness on the channel (\`test/harness/run.sh\`, \`OMARCHY_CHANNEL=$CHANNEL test/harness/full.sh\`)."
            fi
            for kind in $kinds; do
              case $kind in
                patches) echo "- A patch does not apply (Patches): rebase the fork branch onto the target and recut the series with \`bin/omarchy-port-series\`." ;;
                packages | names | migrations) echo "- A package name has no Ubuntu source ($kind, in bold below): an alias, a recipe or a skip with its reason in \`omarchy-pkg-ubuntu\`, fork patch 0001 of the series." ;;
                versions) echo "- A pin is behind upstream (Versions, in bold): bring it to upstream's in \`versions.env\`, or in \`versions.rc.env\` when only rc and edge carry it." ;;
              esac
            done
            echo
            echo "This issue closes itself on the first run that finds nothing left: daily, and on every push to main that touches the pins, the series, the package lists or the catalog."
            echo
            cat report.md
            echo
            echo "_Run ${{ github.run_id }} of ${{ github.workflow }}, $(date -u +%F)._"
          } >body.md

          if [[ -n $number ]]; then
            gh issue edit "$number" --title "$title" --body-file body.md
          else
            gh label create upstream --description "what the port has to do to follow upstream" --color 0e8a16 --force
            gh issue create --title "$title" --body-file body.md --label upstream
          fi
