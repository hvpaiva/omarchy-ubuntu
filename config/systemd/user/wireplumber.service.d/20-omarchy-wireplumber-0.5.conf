# omarchy-ubuntu (step 45 builds it, step 46 installs this): upstream's
# WirePlumber 0.5 in place of noble's 0.4, its configuration read where Arch's
# is, and from /usr/local instead of 0.4's /usr/share/wireplumber.
[Service]
Environment=WIREPLUMBER_CONFIG_DIR=%h/.config/wireplumber:/etc/xdg/wireplumber:/etc/wireplumber:/usr/local/share/wireplumber
Environment=WIREPLUMBER_DATA_DIR=%h/.local/share/wireplumber:/usr/local/share/wireplumber
ExecStart=
ExecStart=/usr/local/bin/wireplumber
